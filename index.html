<script>
'use strict';
const TOPICS=[
 {id:'bernoulli',name:'Bernoulli',icon:'🎯',color:'#194b47',level:1,pdf:'Puente conceptual',desc:'Un ensayo, dos resultados. El fundamento de la binomial.',short:'1 ensayo · éxito / fracaso'},
 {id:'binomial',name:'Binomial',icon:'🎲',color:'#283d70',level:2,pdf:'Ej. 3–7 y 10',desc:'Repeticiones independientes, probabilidades exactas y acumuladas.',short:'n ensayos · misma p'},
 {id:'esperanza',name:'Cuantía y esperanza',icon:'⚖️',color:'#53422a',level:3,pdf:'Ej. 1–2',desc:'Funciones de probabilidad, normalización y valor esperado.',short:'Σ p(x) = 1'},
 {id:'hipergeometrica',name:'Hipergeométrica',icon:'🃏',color:'#513b5f',level:4,pdf:'Ej. 8 y 10',desc:'Muestras sin reposición de una población finita.',short:'Sin reposición'},
 {id:'poisson',name:'Poisson',icon:'🚗',color:'#48442b',level:5,pdf:'Ej. 9 y 10',desc:'Conteos de eventos durante un intervalo de tiempo.',short:'Tasa λ por intervalo'},
 {id:'aproximaciones',name:'Aproximaciones',icon:'🔬',color:'#444d63',level:6,pdf:'Ej. 10',desc:'Compará hipergeométrica, binomial y Poisson con criterio.',short:'Elegí el modelo'}
];
const THEORY={
 bernoulli:{phrase:'X ~ Bernoulli(p)',body:'Un experimento tiene solo dos posibles resultados, codificados como 1 (éxito) y 0 (fracaso). La probabilidad de éxito es p.',formula:'P(X = 1) = p   ·   P(X = 0) = 1 − p',conditions:['Un único ensayo aleatorio','Solo éxito (1) o fracaso (0)','p está entre 0 y 1'],trap:'«Éxito» no significa necesariamente algo bueno: puede ser «salió defectuoso».',example:'Si P(aprobar)=0,8, entonces P(no aprobar)=0,2; E(X)=0,8 y Var(X)=0,8·0,2=0,16.',cards:[['¿Cuál es el soporte de una Bernoulli?','Solo {0, 1}.'],['¿Cuánto vale la media de X?','E(X)=p.'],['¿Cómo calculo la varianza?','Var(X)=p(1−p).']]},
 binomial:{phrase:'X ~ Binomial(n, p)',body:'Cuenta la cantidad de éxitos en n ensayos de Bernoulli independientes con la misma probabilidad p.',formula:'P(X = k) = C(n,k) · pᵏ · (1−p)ⁿ⁻ᵏ',conditions:['Cantidad fija de ensayos n','Dos resultados por ensayo','Independencia y probabilidad p constante'],trap:'«Como máximo k» es X ≤ k; «al menos k» es X ≥ k. Usá el complemento para simplificar algunas colas.',example:'En 5 accidentes, si p=0,75 de ser por error humano, P(exactamente 2)=C(5,2)·0,75²·0,25³≈0,0879.',cards:[['¿Qué significa «exactamente 3»?','P(X=3), no P(X≤3).'],['¿Y «como máximo 1»?','P(X≤1)=P(X=0)+P(X=1).'],['¿Qué es P(X>1)?','1−P(X≤1).']]},
 esperanza:{phrase:'Σ p(x) = 1    ·    E(X) = Σ x·p(x)',body:'Una función de cuantía asigna a cada valor posible de X una probabilidad no negativa. Todas las probabilidades suman 1.',formula:'E(X) = Σ [x · p(x)]',conditions:['p(x) ≥ 0 para cada valor','La suma de todas las p(x) es 1','El promedio esperado pondera cada x por su p(x)'],trap:'E(X) no tiene por qué ser un valor posible de la variable.',example:'Práctico 4, ej. 1: p(x)=ax para x=1,…,5. Como 15a=1, resulta a=1/15; E(X)=55/15=11/3.',cards:[['¿Para qué sirve Σp(x)=1?','Para encontrar constantes de normalización como a.'],['¿Qué es E(X)?','La suma ponderada de los valores por sus probabilidades.'],['¿Puede E(X) ser 3,67 si X es entero?','Sí, el valor esperado no tiene que pertenecer al soporte.']]},
 hipergeometrica:{phrase:'X ~ Hipergeométrica(N, K, n)',body:'Contá éxitos en una muestra extraída SIN reposición de una población finita: N elementos totales, K éxitos, n extracciones.',formula:'P(X=k) = C(K,k)·C(N−K,n−k) / C(N,n)',conditions:['Población finita N, con K éxitos','Muestra de tamaño n sin reposición','La probabilidad cambia entre extracciones'],trap:'Si extraés sin reposición, los ensayos no son independientes: no uses binomial como cálculo exacto.',example:'Ej. 8: de 9 comprobaciones (2 fraudulentas) se eligen 3. P(al menos una fraudulenta)=1−C(7,3)/C(9,3).',cards:[['¿Qué significa sin reposición?','Cada elemento extraído no vuelve a la población.'],['¿Qué significa K?','Cantidad de éxitos dentro de la población de tamaño N.'],['¿Cómo calculo «al menos un éxito»?','1−P(X=0).']]},
 poisson:{phrase:'X ~ Poisson(λ)',body:'Modela cuántos sucesos ocurren en un intervalo, cuando conocemos una tasa promedio λ y asumimos un proceso Poisson.',formula:'P(X=k) = e⁻λ · λᵏ / k!',conditions:['Los eventos se cuentan por intervalo','La tasa media λ se mantiene estable','Los conteos en intervalos disjuntos son independientes (modelo Poisson)'],trap:'Si la tasa es 6 por minuto, en 2 minutos λ pasa a 12; no se mantiene en 6.',example:'Ej. 9: pasan 6 autos por minuto en Pando. La probabilidad de 0 autos en un minuto es e⁻⁶≈0,00248.',cards:[['¿Qué es λ?','Número esperado de eventos en el intervalo elegido.'],['¿Qué cambia al duplicar el tiempo?','Si la tasa es constante, se duplica λ.'],['¿Cómo se calcula P(X=0)?','e⁻λ.']]},
 aproximaciones:{phrase:'Hipergeométrica → Binomial → Poisson',body:'A veces reemplazamos una distribución por otra para aproximar su probabilidad. La elección depende del muestreo, n y p.',formula:'Hipergeom.: N,K,n    |    Binomial: n,p    |    Poisson: λ=np',conditions:['Hipergeométrica: exacta al muestrear sin reposición','Binomial: aproxima si n es pequeño frente a N','Poisson: aproxima binomial cuando n es suficientemente grande y p pequeño'],trap:'Que dos resultados se parezcan no significa que la aproximación esté justificada para todo el problema.',example:'Ej. 10: lote de 1000, 50 defectuosas y muestra 10. Compará P(X=0) exacta, 0,95¹⁰ y e⁻⁰·⁵; explicá los supuestos.',cards:[['¿Cuál es el modelo exacto de una muestra sin reposición?','La hipergeométrica.'],['¿Qué p usa la aproximación binomial del lote?','p=50/1000=0,05.'],['¿Qué λ usa la Poisson de ese ejemplo?','λ=n·p=10·0,05=0,5.']]}
};
const EXERCISES=[
 [1,'Construir una función de cuantía','Hallar a y E(X) con p(x)=a·x, x=1,…,5.','esperanza'],
 [2,'Cuantía con valor absoluto','Calcular E(X) para p(x)=(|x−3|+1)/28, x=−3,…,3.','esperanza'],
 [3,'Accidentes y errores humanos','Cinco accidentes; probabilidad 0,75 de error humano.','binomial'],
 [4,'El juego de cara o cruz','¿Cuál es la probabilidad de no terminar luego de 8 lanzamientos?','binomial'],
 [5,'Identificar el parámetro p','Binomial(n=10), con P(X=0)=0,3486; calcular otras probabilidades.','binomial'],
 [6,'Respaldo de un cohete','Mínimo de sistemas independientes para alcanzar confiabilidad 0,99.','binomial'],
 [7,'Matrículas de Informática','10 matrículas; 30% Ingeniería y 70% Licenciatura.','binomial'],
 [8,'Auditoría de comprobaciones','Extraer 3 comprobaciones de 9, sin reposición.','hipergeometrica'],
 [9,'Tránsito en el peaje de Pando','Llegan en promedio 6 autos por minuto.','poisson'],
 [10,'Control de calidad de un lote','1000 unidades, 5% defectuosas; extraer 10 sin reposición.','aproximaciones']
];
const logFactor=[0];for(let i=1;i<=1100;i++)logFactor[i]=logFactor[i-1]+Math.log(i);
const logC=(n,k)=>{if(k<0||k>n||!Number.isInteger(k))return -Infinity;if(n<=1100)return logFactor[n]-logFactor[k]-logFactor[n-k];let s=0;for(let i=1;i<=k;i++)s+=Math.log(n-k+i)-Math.log(i);return s};
const choose=(n,k)=>Math.round(Math.exp(logC(n,k)));
const binom=(n,p,k)=>k<0||k>n?0:p===0?(k===0?1:0):p===1?(k===n?1:0):Math.exp(logC(n,k)+k*Math.log(p)+(n-k)*Math.log1p(-p));
const bcdf=(n,p,k)=>{let sum=0;for(let i=0;i<=Math.min(n,Math.floor(k));i++)sum+=binom(n,p,i);return Math.min(1,sum)};
const hyper=(N,K,n,k)=>{if(k<0||k>K||k>n||n-k>N-K)return 0;return Math.exp(logC(K,k)+logC(N-K,n-k)-logC(N,n))};
const pois=(lambda,k)=>k<0?0:Math.exp(-lambda+k*Math.log(lambda)-logFactor[k]);
const pcdf=(lambda,k)=>{let s=0;for(let i=0;i<=k;i++)s+=pois(lambda,i);return Math.min(s,1)};
const pct=(p,d=2)=>(100*p).toLocaleString('es-UY',{maximumFractionDigits:d,minimumFractionDigits:d})+' %';
const fmt=(n,d=4)=>Number(n).toLocaleString('es-UY',{maximumFractionDigits:d});
const rnd=(arr)=>arr[Math.floor(Math.random()*arr.length)];
const shuffle=(arr)=>[...arr].sort(()=>Math.random()-.5);
const baseQuestions=[];
function add(q){baseQuestions.push({difficulty:'Intermedio',hints:[],context:'',...q})}
// Preguntas alineadas a los incisos del Práctico 4, más una introducción explícita a Bernoulli.
add({id:'b01',topic:'bernoulli',type:'choice',prompt:'¿Cuál de estas variables puede modelarse con Bernoulli?',options:['Cantidad de autos que llegan en una hora','Resultado de un único control: pasa (1) o falla (0)','Cantidad de defectos en cien productos','Tiempo de espera hasta una llamada'],correct:1,explain:'Bernoulli tiene un solo ensayo y dos resultados posibles, codificados como 0 y 1.',hints:['Buscá un solo ensayo, no un conteo repetido.','El espacio de resultados de la variable debe ser {0,1}.']});
add({id:'b02',topic:'bernoulli',type:'number',prompt:'Si un sistema funciona con probabilidad 0,80, ¿cuál es la probabilidad de que falle en un único encendido?',correct:.2,tolerance:.001,explain:'P(falla)=1−P(funciona)=1−0,80=0,20.',hints:['Los resultados son excluyentes y exhaustivos.','Sumá P(éxito)+P(fracaso)=1.'],context:'Respondé como decimal; también podés escribir 20%.'});
add({id:'b03',topic:'bernoulli',type:'number',prompt:'Si X ~ Bernoulli(0,30), ¿cuánto vale E(X)?',correct:.3,tolerance:.001,explain:'Para Bernoulli(p), E(X)=p; por tanto E(X)=0,30.',hints:['La media de Bernoulli tiene una fórmula muy corta.','E(X)=0·(1−p)+1·p.']});
add({id:'b04',topic:'bernoulli',type:'number',prompt:'Si X ~ Bernoulli(0,60), ¿cuánto vale Var(X)?',correct:.24,tolerance:.001,explain:'Var(X)=p(1−p)=0,60·0,40=0,24.',hints:['La varianza de Bernoulli usa p y su complemento.','Multiplicá 0,6 por 0,4.']});
add({id:'b05',topic:'bernoulli',type:'multi',prompt:'Marcá TODAS las propiedades de una variable Bernoulli.',options:['Sus valores posibles son 0 y 1','Su media es igual a p','Tiene que haber por lo menos 10 ensayos','Su varianza es p(1−p)'],correct:[0,1,3],explain:'Es un ensayo binario; E(X)=p y Var(X)=p(1−p). Diez ensayos no son requisito.',hints:['Separá Bernoulli de binomial.','Tres de las cuatro opciones son correctas.']});
add({id:'bn01',topic:'binomial',type:'choice',prompt:'¿Cuándo conviene usar una distribución binomial?',options:['Seleccionar sin reposición 3 de 9 comprobaciones','Contar éxitos en 10 ensayos independientes con p constante','Contar llegadas por minuto con una tasa λ','Calcular una media ponderada cualquiera'],correct:1,explain:'La binomial cuenta éxitos en n ensayos independientes con igual p.',hints:['Pensá en repeticiones de experimentos de Bernoulli.','Buscá n fijo, independencia y p constante.']});
add({id:'bn02',topic:'binomial',type:'region',n:5,p:.75,prompt:'Seleccioná los valores de X que corresponden a «como máximo un accidente por error humano».',correct:[0,1],explain:'«Como máximo uno» significa X≤1, así que la región incluye 0 y 1.',hints:['La frase no significa exactamente 1.','«Como máximo» incluye el límite indicado y los menores.'],ex:3});
add({id:'ex1a',topic:'esperanza',ex:1,type:'number',prompt:'Si p(x)=a·x para x∈{1,2,3,4,5}, ¿cuál debe ser el valor de a?',correct:1/15,tolerance:.0002,context:'Podés responder como fracción (1/15) o como decimal.',explain:'Σp(x)=a(1+2+3+4+5)=15a=1. Entonces a=1/15≈0,0667.',hints:['Toda función de cuantía debe sumar 1.','1+2+3+4+5=15.']});
add({id:'ex1b',topic:'esperanza',ex:1,type:'number',prompt:'Para p(x)=x/15, x∈{1,…,5}, calculá E(X).',correct:11/3,tolerance:.005,explain:'E(X)=Σx·(x/15)=Σx²/15=(1+4+9+16+25)/15=55/15=11/3≈3,6667.',hints:['E(X)=Σx·p(x).','La suma de cuadrados es 55.']});
add({id:'ex2a',topic:'esperanza',ex:2,type:'number',prompt:'En p(x)=(|x−3|+1)/c para x∈{−3,…,3}, ¿cuánto debe valer c?',correct:28,tolerance:.01,explain:'Los numeradores son 7+6+5+4+3+2+1=28. Para sumar 1, el denominador debe ser 28.',hints:['Sumá todos los numeradores entre −3 y 3.','Los numeradores van de 7 hasta 1.']});
add({id:'ex2b',topic:'esperanza',ex:2,type:'number',prompt:'Si p(x)=(|x−3|+1)/28 para x∈{−3,…,3}, calculá E(X).',correct:-1,tolerance:.005,explain:'E(X)=[−3·7−2·6−1·5+0·4+1·3+2·2+3·1]/28=−28/28=−1.',hints:['Construí la tabla x y p(x) para los siete valores.','Multiplicá los x por los numeradores 7,6,5,4,3,2,1 y dividí entre 28.']});
add({id:'ex3a',topic:'binomial',ex:3,type:'number',prompt:'De 5 accidentes, cada uno atribuible a error humano con p=0,75. ¿Qué probabilidad hay de que exactamente 2 sean por error humano?',correct:binom(5,.75,2),tolerance:.0007,explain:'X~Bin(5;0,75). P(X=2)=C(5,2)·0,75²·0,25³='+fmt(binom(5,.75,2),6)+'.',hints:['Tomá X= número de accidentes por error humano.','Usá C(5,2)·p²·(1−p)³.']});
add({id:'ex3b',topic:'binomial',ex:3,type:'number',prompt:'En los mismos 5 accidentes (p=0,75), calculá P(X≤1), es decir, como máximo uno por error humano.',correct:bcdf(5,.75,1),tolerance:.0005,explain:'P(X≤1)=P(X=0)+P(X=1)=0,25⁵+5·0,75·0,25⁴='+fmt(bcdf(5,.75,1),6)+'.',hints:['Es una probabilidad acumulada, no puntual.','Sumá los casos X=0 y X=1.']});
add({id:'ex3c',topic:'binomial',ex:3,type:'choice',prompt:'¿Cómo traducís «3 accidentes NO se atribuyen a errores humanos», si X cuenta accidentes por error humano entre 5?',options:['P(X=3)','P(X=2)','P(X≤3)','P(X≥3)'],correct:1,explain:'Si 3 NO son por error humano, entonces 5−3=2 SÍ lo son. Corresponde P(X=2).',hints:['Prestá atención a qué variable representa X.','De los 5 accidentes, restá los 3 que no son por error humano.']});
add({id:'ex4',topic:'binomial',ex:4,type:'number',prompt:'Con una moneda equilibrada, el juego termina cuando cara y cruz han aparecido al menos 3 veces cada una. ¿Cuál es P(no terminar después de 8 lanzamientos)?',correct:74/256,tolerance:.001,explain:'Tras 8 lanzamientos, no se termina si alguna cara salió a lo sumo 2 veces. Son casos disjuntos: 2·[C(8,0)+C(8,1)+C(8,2)]/2⁸=74/256=0,2890625.',hints:['A los 8 lanzamientos, no terminar equivale a tener ≤2 caras o ≤2 cruces.','Por simetría, contá los resultados con 0, 1 o 2 caras y multiplicá por 2.']});
add({id:'ex5a',topic:'binomial',ex:5,type:'number',prompt:'Si X~Binomial(10,p) y P(X=0)=0,3486, ¿cuál es p aproximadamente?',correct:1-Math.pow(.3486,1/10),tolerance:.002,explain:'(1−p)¹⁰=0,3486, luego p=1−(0,3486)^(1/10)≈'+fmt(1-Math.pow(.3486,1/10),5)+' ≈ 0,10.',hints:['P(X=0)=(1−p)ⁿ.','Despejá p mediante raíz décima.']});
add({id:'ex5b',topic:'binomial',ex:5,type:'number',prompt:'Usando n=10 y p≈0,10, calculá F(1)=P(X≤1).',correct:bcdf(10,.1,1),tolerance:.002,explain:'F(1)=P(0)+P(1)=0,9¹⁰+10·0,1·0,9⁹≈'+fmt(bcdf(10,.1,1),6)+'.',hints:['F es la función de distribución acumulada.','Sumá la probabilidad de 0 y de 1 éxito.']});
add({id:'ex5c',topic:'binomial',ex:5,type:'number',prompt:'Con X~Binomial(10;0,10), calculá P(X>1).',correct:1-bcdf(10,.1,1),tolerance:.002,explain:'P(X>1)=1−P(X≤1)=1−'+fmt(bcdf(10,.1,1),5)+'≈'+fmt(1-bcdf(10,.1,1),6)+'.',hints:['Usá el complemento.','P(X>1)=1−P(X≤1).']});
add({id:'ex6a',topic:'binomial',ex:6,type:'number',prompt:'Cada sistema electrónico funciona con p=0,80. ¿Cuántos sistemas independientes en total hacen falta para que P(al menos uno funcione)≥0,99?',correct:3,tolerance:.01,explain:'1−(1−0,8)ⁿ≥0,99 ⇔ 0,2ⁿ≤0,01. Con n=2 se obtiene 0,96; con n=3, 0,992. Se requieren 3 sistemas en total (2 respaldos, si ya existe un sistema principal).',hints:['La probabilidad de que ninguno funcione es (1−p)ⁿ.','Buscá el primer entero n con 1−0,2ⁿ≥0,99.']});
add({id:'ex6b',topic:'binomial',ex:6,type:'number',prompt:'¿Y cuántos sistemas independientes en total hacen falta cuando p=0,50 para alcanzar P(al menos uno funcione)≥0,99?',correct:7,tolerance:.01,explain:'1−0,5ⁿ≥0,99. Para n=6: 0,984375; para n=7: 0,9921875. La respuesta es 7 en total (6 respaldos, si ya existe un sistema principal).',hints:['Tomá el complemento del evento «ninguno funciona».','Probá n=6 y n=7 en 1−0,5ⁿ.']});
add({id:'ex7a',topic:'binomial',ex:7,type:'number',prompt:'En 10 matrículas, la probabilidad de Ingeniería es 0,30. ¿Cuál es la probabilidad de exactamente 5 matrículas en cada carrera?',correct:binom(10,.3,5),tolerance:.001,explain:'Si X=matrículas en Ingeniería, empate equivale a X=5. P(X=5)=C(10,5)·0,3⁵·0,7⁵≈'+fmt(binom(10,.3,5),6)+'.',hints:['«Igual número» entre dos carreras implica 5 y 5.','Usá Binomial(n=10,p=0,3), con k=5.']});
add({id:'ex7b',topic:'binomial',ex:7,type:'region',n:10,p:.3,prompt:'Seleccioná los valores de X para los que hay MENOS matrículas en Ingeniería que en Licenciatura, en 10 inscripciones.',correct:[0,1,2,3,4],explain:'Si X es Ingeniería, Licenciatura es 10−X. X<10−X implica X<5, por tanto X∈{0,1,2,3,4}.',hints:['Planteá X<10−X.','La desigualdad da X<5.']});
add({id:'ex7c1',topic:'binomial',ex:7,type:'number',prompt:'Las primeras 3 matrículas son de Licenciatura. Si cada matrícula es independiente (p Ingeniería=0,30), ¿cuál es la probabilidad de terminar con 5 en cada carrera?',correct:binom(7,.3,5),tolerance:.001,explain:'En las 7 matrículas restantes necesitamos exactamente 5 de Ingeniería. Por independencia, P=C(7,5)·0,3⁵·0,7²≈'+fmt(binom(7,.3,5),6)+'.',hints:['Quedan solo 7 matrículas por observar.','Para empatar, necesitás 5 de Ingeniería en las 7 restantes.']});
add({id:'ex7c2',topic:'binomial',ex:7,type:'number',prompt:'Sabiendo que las primeras 3 fueron Licenciatura, ¿cuál es P(al menos 2 matrículas más en Licenciatura que en Ingeniería) al completar las 10?',correct:bcdf(7,.3,4),tolerance:.001,explain:'Con 10 en total, Licenciatura−Ingeniería≥2 ⇔ Ingeniería≤4. En las 7 restantes Y~Bin(7;0,3), por tanto P(Y≤4)≈'+fmt(bcdf(7,.3,4),6)+'.',hints:['Traducí L−I≥2 sabiendo que L+I=10.','Equivale a I≤4; contá Ingeniería solo entre las últimas 7 matrículas.']});
add({id:'ex8a',topic:'hipergeometrica',ex:8,type:'number',prompt:'De 9 comprobaciones, 2 son fraudulentas. Si se eligen 3 SIN reposición, ¿cuál es P(encontrar al menos 1 fraudulenta)?',correct:1-hyper(9,2,3,0),tolerance:.001,explain:'P(X≥1)=1−P(X=0)=1−C(7,3)/C(9,3)='+fmt(1-hyper(9,2,3,0),6)+'.',hints:['Modelá con N=9,K=2,n=3.','Complemento: 1−P(cero fraudulentas).']});
add({id:'ex8b',topic:'hipergeometrica',ex:8,type:'number',prompt:'Repetí el muestreo sin reposición de 3 de 9, pero ahora 5 comprobaciones son fraudulentas. ¿Cuál es P(al menos 1)?',correct:1-hyper(9,5,3,0),tolerance:.001,explain:'P(X≥1)=1−C(4,3)/C(9,3)='+fmt(1-hyper(9,5,3,0),6)+'.',hints:['Hay N−K=4 no fraudulentas.','Para no encontrar fraudes, las 3 elegidas deben estar entre esas 4.']});
add({id:'ex8c',topic:'hipergeometrica',ex:8,type:'number',prompt:'Entre 9 comprobaciones hay 8 fraudulentas. Si revisás 3 SIN reposición, ¿cuánto vale P(encontrar al menos 1 fraudulenta)?',correct:1,tolerance:.0001,explain:'Solo existe 1 comprobación legítima; resulta imposible extraer 3 legítimas. P(X=0)=0, así que P(X≥1)=1.',hints:['¿Podés elegir 3 comprobaciones no fraudulentas si solo hay una?','El evento complementario es imposible.']});
add({id:'ex9a',topic:'poisson',ex:9,type:'number',prompt:'Por el peaje de Pando pasan en promedio 6 autos por minuto. Bajo un modelo Poisson, ¿cuál es P(0 autos en 1 minuto)?',correct:pois(6,0),tolerance:.0002,explain:'X~Pois(6). P(X=0)=e⁻⁶≈'+fmt(pois(6,0),7)+'.',hints:['λ=6 para un minuto.','P(X=0)=e⁻λ.']});
add({id:'ex9b',topic:'poisson',ex:9,type:'number',prompt:'En el peaje pasan 6 autos por minuto. ¿Cuál es P(al menos 5 autos en 2 minutos) bajo un proceso Poisson?',correct:1-pcdf(12,4),tolerance:.002,explain:'En 2 minutos λ=12. P(X≥5)=1−P(X≤4)=1−Σ(k=0..4)e⁻¹²·12ᵏ/k!≈'+fmt(1-pcdf(12,4),6)+'.',hints:['Ajustá λ al intervalo de 2 minutos.','«Al menos 5» es 1−P(X≤4).']});
add({id:'ex9c',topic:'poisson',ex:9,type:'number',prompt:'En 1 minuto, con tasa λ=6 autos, ¿qué probabilidad hay de que pasen exactamente 6 autos?',correct:pois(6,6),tolerance:.001,explain:'P(X=6)=e⁻⁶·6⁶/6!≈'+fmt(pois(6,6),6)+'.',hints:['Es una probabilidad puntual de Poisson.','Usá k=6 y λ=6.']});
const ex10exact=hyper(1000,50,10,0),ex10bin=binom(10,.05,0),ex10poisson=pois(.5,0);
add({id:'ex10a',topic:'hipergeometrica',ex:10,type:'number',prompt:'Un lote de 1000 unidades contiene 50 defectuosas. Se inspeccionan 10 SIN reposición. ¿Cuál es la probabilidad exacta de aceptar el lote (0 defectos)?',correct:ex10exact,tolerance:.002,explain:'X~Hipergeométrica(N=1000,K=50,n=10). P(X=0)=C(950,10)/C(1000,10)≈'+fmt(ex10exact,7)+'.',hints:['El lote se acepta solamente con X=0 defectos.','Usá C(50,0)·C(950,10)/C(1000,10).']});
add({id:'ex10b',topic:'binomial',ex:10,type:'number',prompt:'Aproximá la probabilidad de aceptar el lote anterior con una binomial: n=10, p=0,05. ¿Cuánto vale P(X=0)?',correct:ex10bin,tolerance:.001,explain:'P(X=0)≈(1−0,05)¹⁰=0,95¹⁰≈'+fmt(ex10bin,7)+'. Se ignora la ligera variación de p por no reposición.',hints:['Aceptar = cero defectos.','En binomial, P(X=0)=(1−p)ⁿ.']});
add({id:'ex10c',topic:'poisson',ex:10,type:'number',prompt:'Si aproximás la binomial del lote con Poisson(λ=n·p=0,5), ¿qué probabilidad obtenés de 0 defectos?',correct:ex10poisson,tolerance:.001,explain:'P(X=0)≈e⁻⁰·⁵≈'+fmt(ex10poisson,7)+'. La aproximación Poisson requiere precaución porque n=10 no es grande.',hints:['Calculá λ=10·0,05.','P(X=0)=e⁻λ.']});
add({id:'ex10d',topic:'aproximaciones',ex:10,type:'choice',prompt:'¿Por qué la aproximación de Poisson no es la más justificada para el lote de 10 inspecciones con p=0,05?',options:['Porque Poisson no puede calcular P(X=0)','Porque n=10 es pequeño para la aproximación binomial→Poisson','Porque p=0,05 es mayor que 1','Porque la hipergeométrica exige reposición'],correct:1,explain:'La Poisson es una aproximación habitual con n grande, p pequeño y λ=np moderado. En el práctico, n=10 es pequeño; la hipergeométrica da el resultado exacto.',hints:['Pensá en las condiciones de aproximación, no en si las fórmulas funcionan.','La condición cuestionable es el tamaño n.']});
add({id:'ap01',topic:'aproximaciones',type:'choice',prompt:'Si sacás 3 tarjetas de 9 SIN devolverlas, ¿qué modelo da una probabilidad exacta del número de tarjetas rojas?',options:['Bernoulli','Poisson','Hipergeométrica','Binomial'],correct:2,explain:'El muestreo sin reposición y la población finita caracterizan a la hipergeométrica.',hints:['La probabilidad de roja cambia entre extracciones.','La respuesta incorpora N, K y n.']});
add({id:'ap02',topic:'aproximaciones',type:'multi',prompt:'Seleccioná las afirmaciones correctas acerca de las aproximaciones.',options:['Si se muestrea sin reposición, el modelo exacto puede ser hipergeométrico','La aproximación binomial es mejor si n/N es pequeño','La aproximación Poisson siempre es exacta para una binomial','En la aproximación Poisson, λ=n·p'],correct:[0,1,3],explain:'La hipergeométrica es exacta sin reposición, la binomial puede aproximarla para una muestra pequeña respecto a la población y la Poisson usa λ=np bajo condiciones apropiadas.',hints:['No todas las aproximaciones son igualdades exactas.','Tres afirmaciones son correctas.']});
add({id:'ap03',topic:'aproximaciones',type:'choice',prompt:'Un servicio recibe llamadas con tasa estable de 4 por hora. ¿Qué modelo usarías para contar las llamadas en una hora?',options:['Poisson con λ=4','Hipergeométrica con K=4','Bernoulli con p=4','Binomial con n=4'],correct:0,explain:'Con el supuesto de un proceso Poisson, los conteos por intervalo se modelan con λ igual a la tasa esperada en ese intervalo.',hints:['Se trata de eventos que llegan durante un intervalo.','Usá una distribución de conteos basada en una tasa λ.']});
function generated(topic){
 let p,n,k,lambda,N,K,m,op,value,q;
 if(topic==='bernoulli'){p=rnd([.2,.35,.4,.55,.65,.8,.9]);op=rnd(['éxito','fracaso','media','varianza']);value=op==='éxito'?p:op==='fracaso'?1-p:op==='media'?p:p*(1-p);return {id:'gen-b-'+Date.now()+Math.random(),topic,type:'number',prompt:'Sea X~Bernoulli('+fmt(p,2)+'). Calculá '+(op==='éxito'?'P(X=1).':op==='fracaso'?'P(X=0).':op==='media'?'E(X).':'Var(X).'),correct:value,tolerance:.002,explain:'Para Bernoulli: P(1)=p, P(0)=1−p, E(X)=p y Var(X)=p(1−p). Resultado: '+fmt(value,5)+'.',hints:['Revisá qué representan 0 y 1.','Las fórmulas son p, 1−p, p y p(1−p).']}}
 if(topic==='binomial'){n=rnd([4,5,6,8,10,12]);p=rnd([.2,.3,.4,.6,.75]);k=Math.floor(Math.random()*Math.min(5,n+1));op=rnd(['exactamente','como máximo','al menos']);value=op==='exactamente'?binom(n,p,k):op==='como máximo'?bcdf(n,p,k):1-bcdf(n,p,k-1);return {id:'gen-bin-'+Date.now()+Math.random(),topic,type:'number',prompt:'En '+n+' ensayos independientes, cada uno con probabilidad de éxito '+fmt(p,2)+', calculá P('+({exactamente:'X = ', 'como máximo':'X ≤ ', 'al menos':'X ≥ '})[op]+k+').',correct:value,tolerance:.0015,explain:'X~Bin('+n+';'+fmt(p,2)+'). '+(op==='exactamente'?'Aplicá C(n,k)·pᵏ·(1−p)ⁿ⁻ᵏ.':op==='como máximo'?'Sumá P(X=i) desde i=0 hasta '+k+'.':'Usá el complemento P(X≥k)=1−P(X≤k−1).')+' Resultado: '+fmt(value,6)+'.',hints:['Identificá n, p y la región de k.','La frase «'+op+'» define qué términos sumar o qué complemento calcular.']}}
 if(topic==='hipergeometrica'){N=rnd([12,15,20,24]);K=rnd([4,5,6,8]);m=rnd([3,4,5]);value=1-hyper(N,K,m,0);return {id:'gen-h-'+Date.now()+Math.random(),topic,type:'number',prompt:'En una población de '+N+' elementos, '+K+' son especiales. Si elegís '+m+' sin reposición, ¿qué probabilidad hay de obtener al menos 1 especial?',correct:value,tolerance:.0015,explain:'P(X≥1)=1−C('+(N-K)+','+m+')/C('+N+','+m+')≈'+fmt(value,6)+'.',hints:['El evento complementario es sacar 0 especiales.','Usá 1−P(X=0) con la hipergeométrica.']}}
 if(topic==='poisson'){lambda=rnd([2,3,4,5,6,8]);k=rnd([0,1,2,3,4,5]);op=rnd(['exactamente','a lo sumo','al menos']);value=op==='exactamente'?pois(lambda,k):op==='a lo sumo'?pcdf(lambda,k):1-pcdf(lambda,k-1);return {id:'gen-p-'+Date.now()+Math.random(),topic,type:'number',prompt:'La cantidad de eventos en un intervalo sigue Poisson('+lambda+'). Calculá P('+({exactamente:'X = ','a lo sumo':'X ≤ ','al menos':'X ≥ '})[op]+k+').',correct:value,tolerance:.0015,explain:'En Poisson(λ='+lambda+'), P(X=i)=e⁻λ·λⁱ/i!. '+(op==='exactamente'?'Evaluá en i='+k+'.':op==='a lo sumo'?'Sumá desde i=0 hasta '+k+'.':'Usá el complemento hasta '+(k-1)+'.')+' Resultado: '+fmt(value,6)+'.',hints:['Usá λ='+lambda+' para el intervalo actual.','La palabra «'+op+'» determina la región de valores que necesitás.']}}
 if(topic==='esperanza'){n=rnd([3,4,5,6]);value=1/(n*(n+1)/2);return {id:'gen-e-'+Date.now()+Math.random(),topic,type:'number',prompt:'Si p(x)=a·x para x∈{1,…,'+n+'}, ¿qué valor de a normaliza la función?',correct:value,tolerance:.0005,explain:'Σ(x=1..'+n+')x='+n*(n+1)/2+'. Entonces a=1/'+(n*(n+1)/2)+'≈'+fmt(value,6)+'.',hints:['La suma de probabilidades debe ser 1.','1+2+⋯+n=n(n+1)/2.']}}
 return null;
}
function loadSaved(){try{const j=JSON.parse(localStorage.getItem('distribulab-practico4-v2')||'{}');return {xp:0,solved:{},streak:0,bestStreak:0,totalCorrect:0,totalAttempts:0,sessions:0,...j}}catch{return {xp:0,solved:{},streak:0,bestStreak:0,totalCorrect:0,totalAttempts:0,sessions:0}}}

const $=(s)=>document.querySelector(s),$$=(s)=>Array.from(document.querySelectorAll(s));
function persist(){try{localStorage.setItem('distribulab-practico4-v2',JSON.stringify(saved))}catch{}}
function levelNum(){return 1+Math.floor(saved.xp/500)}
function levelName(){const l=levelNum();return l<3?'Explorador':l<6?'Analista':l<10?'Especialista':'Maestro de azar'}
function topicProgress(t){const qs=baseQuestions.filter(q=>q.topic===t);const done=qs.filter(q=>saved.solved[q.id]).length;return {done,total:qs.length,percent:qs.length?Math.round(done/qs.length*100):0}}
function toast(message){const z=$('#toast-zone');const n=document.createElement('div');n.className='toast';n.textContent=message;z.append(n);setTimeout(()=>n.remove(),3600)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function nav(next,opts={}){if(next!=='quiz'&&session){stopTimer();session=null}view=next;if(opts.topic)topic=opts.topic;if(next==='teoria'){flash=0;flashShown=false}render();window.scrollTo({top:0,behavior:'smooth'})}
function updateHead(){const l=levelNum();$('#header-xp').textContent=saved.xp;$('#header-streak').textContent=saved.streak;$('#header-level').textContent=l;$('#side-level').textContent='Nivel '+l+' · '+levelName();$('#side-meter').style.width=(saved.xp%500)/5+'%';$('#side-xp').textContent=(saved.xp%500)+' / 500 XP';$$('[data-view]').forEach(btn=>btn.classList.toggle('active',btn.dataset.view===view||(view==='quiz'&&btn.dataset.view==='ruta')));let names={inicio:'Inicio',ruta:'Ruta de aprendizaje',practico:'Práctico 4',teoria:'Teoría interactiva',laboratorio:'Laboratorio',progreso:'Mi progreso',taller:'Taller de resolución',quiz:'Desafío activo'};$('#breadcrumb').textContent=names[view]||view}

ruta aparecen casos para identificar el modelo antes de calcular.</div></aside></div>`}
function startSession(mode,key){stopTimer();let qs=[];
 if(mode==='workshop')qs=(String(key).startsWith('single:')?WORKSHOP_QUESTIONS.filter(q=>q.id===String(key).slice(7)):key==='todos'?WORKSHOP_QUESTIONS:WORKSHOP_QUESTIONS.filter(q=>q.topic===key)).map(q=>({...q}));
 if(mode==='topic'){qs=baseQuestions.filter(q=>q.topic===key).map(q=>({...q}));if(key!=='aproximaciones'){for(let i=0;i<3;i++){let q=generated(key);if(q)qs.push(q)}}}
 if(mode==='exercise')qs=baseQuestions.filter(q=>q.ex===Number(key)).map(q=>({...q}));
 if(mode==='practical')qs=EXERCISES.map(([n])=>rnd(baseQuestions.filter(q=>q.ex===n))).map(q=>({...q}));
 if(mode==='quick'){let chosen=[...shuffle(baseQuestions.filter(q=>q.topic==='bernoulli')).slice(0,1),...shuffle(baseQuestions.filter(q=>q.topic==='binomial')).slice(0,3),...shuffle(baseQuestions.filter(q=>q.topic==='esperanza')).slice(0,1),...shuffle(baseQuestions.filter(q=>q.topic==='hipergeometrica')).slice(0,1),...shuffle(baseQuestions.filter(q=>q.topic==='poisson')).slice(0,1),...shuffle(baseQuestions.filter(q=>q.topic==='aproximaciones')).slice(0,1)];qs=shuffle(chosen).map(q=>({...q}))}
 if(!qs.length)return toast('Todavía no hay retos en esta sección.');
 session={mode,key,queue:qs,index:0,answer:null,feedback:null,attempts:0,hintsUsed:0,completed:0,points:0,roundStreak:0,clock:mode==='quick'?120:null,timeEnded:false};saved.sessions++;persist();view='quiz';render();window.scrollTo({top:0,behavior:'smooth'});
 if(mode==='quick'){timerId=setInterval(()=>{if(!session||view!=='quiz'){stopTimer();return}if(session.clock>0)session.clock--;const c=$('#clock');if(c)c.textContent=clockFmt(session.clock);if(session.clock<=0){session.timeEnded=true;session.index=session.queue.length;stopTimer();render();toast('⏱ Tiempo terminado: mirá tu resultado.')}},1000)}
}
function clockFmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function questionTitle(q){const t=TOPICS.find(a=>a.id===q.topic);return (q.ex?'Práctico 4 · Ejercicio '+q.ex:t.name)+' · '+(q.difficulty||'Intermedio')}
function quizView(){if(!session)return homeView();if(session.index>=session.queue.length)return finishView();const q=session.queue[session.index];let done=session.index;let questionInput='';
 if(q.type==='choice'||q.type==='multi'){questionInput=`<div class="options" role="group" aria-label="Opciones de respuesta">${q.options.map((o,i)=>{const chosen=q.type==='choice'?session.answer===i:Array.isArray(session.answer)&&session.answer.includes(i);return `<button type="button" class="option ${chosen?'chosen':''}" aria-pressed="${chosen}" data-action="pick-option" data-index="${i}" ${session.feedback?.correct?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span>${q.type==='multi'?`<span style="margin-left:auto">${chosen?'☑':'☐'}</span>`:''}</button>`}).join('')}</div>${q.type==='multi'?'<div class="small-muted">Podés seleccionar más de una respuesta.</div>':''}`}
 else if(q.type==='number'){questionInput=`<label for="quiz-input" class="small-muted">Tu respuesta numérica</label><input id="quiz-input" class="answer-number" type="text" inputmode="decimal" autocomplete="off" placeholder="Ej.: 0,3486 · 34,86% · 1/15" value="${session.answer===null?'':String(session.answer).replaceAll('&','&amp;').replaceAll('"','&quot;')}" ${session.feedback?.correct?'disabled':''}><div class="answer-guide">Se aceptan decimales con coma o punto, fracciones y porcentajes con %. Hay tolerancia de redondeo.</div>`}
 else if(q.type==='region'){const probabilities=Array.from({length:q.n+1},(_,i)=>binom(q.n,q.p,i)),mx=Math.max(...probabilities);questionInput=`<p class="small-muted">Hacé clic sobre cada valor de X que integra el evento.</p><div class="plot-select" role="group" aria-label="Valores posibles de X">${probabilities.map((p,i)=>{let chosen=(session.answer||[]).includes(i);return `<button class="plot-point ${chosen?'selected':''}" aria-pressed="${chosen}" title="X=${i}: ${pct(p)}" data-action="pick-region" data-index="${i}" ${session.feedback?.correct?'disabled':''}><span style="height:${Math.max(4,105*p/mx)}px"></span><small>${i}</small></button>`}).join('')}</div><p class="small-muted">${q.n+1} valores posibles · X cuenta la cantidad de éxitos.</p>`}
 const answered=session.feedback?.correct||session.feedback?.reveal;
 const hintActive=session.hintsUsed?`<div class="hint-box"><strong>💡 Pista ${session.hintsUsed} de ${q.hints.length}</strong>${q.hints[session.hintsUsed-1]}</div>`:'';
 const feedback=session.feedback?`<div class="feedback ${answered?'good':'bad'}" role="status"><h4>${session.feedback.reveal?'📘 Solución consultada':session.feedback.correct?'✅ ¡Correcto! '+(session.feedback.gain?'+ '+session.feedback.gain+' XP':''):'🔎 Todavía no, revisá el planteo'}</h4><p>${session.feedback.reveal?'Consultá el razonamiento y probá resolver un ejercicio parecido.':session.feedback.correct?'Identificaste correctamente el procedimiento y el resultado.':feedbackHint(q)}</p>${answered?`<div class="solution"><b>Resolución comentada</b><div>${q.explain}</div></div>`:''}</div>`:'';
 return `<div class="quiz-shell"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px;flex-wrap:wrap"><button class="button ghost small" data-action="leave-quiz">← Salir del desafío</button><span class="quick-badge">${session.mode==='quick'?'⏱ <span id="clock">'+clockFmt(session.clock)+'</span>':'✦ '+session.points+' XP obtenidos en esta sesión'}</span></div><div class="quiz-progress"><span class="small-muted">Pregunta <b style="color:var(--text)">${done+1}</b> de ${session.queue.length}</span><div class="meter"><span style="width:${100*done/session.queue.length}%"></span></div><span class="small-muted">${Math.round(100*done/session.queue.length)} %</span></div><div class="quiz-context">${tag('core',questionTitle(q))}${tag('',q.type==='number'?'Respuesta numérica':q.type==='multi'?'Selección múltiple':q.type==='region'?'Elegí en el gráfico':'Opción única')} ${session.hintsUsed?tag('star',session.hintsUsed+' pista(s)'):''}</div><div class="quiz-card"><span class="overline">${q.ex?'Del documento · Ejercicio '+q.ex:'Para construir el concepto'}</span><h1 class="quiz-title">${q.prompt}</h1>${q.context?`<div class="quiz-intro">${q.context}</div>`:''}${questionInput}${hintActive}${feedback}<div class="quiz-actions">${answered?`<button class="button" data-action="next-question">${done===session.queue.length-1?'Ver resultados →':'Siguiente pregunta →'}</button>`:`<button class="button" data-action="check-answer">Comprobar respuesta →</button><button class="button secondary" data-action="get-hint" ${session.hintsUsed>=(q.hints||[]).length?'disabled':''}>💡 Pista ${session.hintsUsed}/${(q.hints||[]).length}</button><button class="button ghost" data-action="reveal-answer">Ver solución</button>`}</div>${!answered?'<p class="reduced">✓ No se revela la respuesta tras el primer error. Podés corregir, pedir pistas o consultar la solución.</p>':''}</div></div>`}
function feedbackHint(q){if(q.type==='region')return 'Revisá si el evento incluye o excluye los extremos. Volvé a seleccionar los valores.';if(q.type==='number')return 'Comprobá los parámetros, el evento y el redondeo. Si escribís un porcentaje, incluí el símbolo %.';if(q.type==='multi')return 'Puede haber más de una respuesta. Verificá qué condiciones son realmente necesarias.';return 'Compará las propiedades del problema con las definiciones y volvé a intentar.'}
function numFromInput(s){s=String(s||'').trim().replace(/\s+/g,'').replace(',','.');let isP=s.endsWith('%');if(isP)s=s.slice(0,-1);let val;if(/^[-+]?\d+(?:\.\d+)?\/[-+]?\d+(?:\.\d+)?$/.test(s)){const [a,b]=s.split('/').map(Number);val=b? a/b:NaN}else val=s!==''?Number(s):NaN;return isP?val/100:val}
function eqSet(a,b){return Array.isArray(a)&&a.length===b.length&&[...a].sort((x,y)=>x-y).every((x,i)=>x===[...b].sort((x,y)=>x-y)[i])}
function checkAnswer(){if(!session||session.feedback?.correct||session.feedback?.reveal)return;const q=session.queue[session.index];let good=false;if(q.type==='number'){const v=numFromInput(session.answer);if(!Number.isFinite(v)){toast('Escribí un número válido para comprobar.');return}good=Math.abs(v-q.correct)<=((q.tolerance??.001)+1e-10)}else if(q.type==='choice')good=session.answer===q.correct;else if(q.type==='multi'||q.type==='region'){if(!session.answer?.length){toast('Elegí al menos una opción.');return}good=eqSet(session.answer,q.correct)}if(q.type==='choice'&&session.answer===null){toast('Primero elegí una respuesta.');return}
 saved.totalAttempts++;
 if(good){let points=Math.max(25,100-session.hintsUsed*30-session.attempts*25);if(saved.solved[q.id])points=Math.min(points,20);saved.xp+=points;saved.totalCorrect++;saved.streak++;saved.bestStreak=Math.max(saved.bestStreak,saved.streak);saved.solved[q.id]=true;session.completed++;session.roundStreak++;session.points+=points;session.feedback={correct:true,gain:points};if(session.roundStreak===3)toast('🔥 ¡3 aciertos seguidos en esta ronda!');if(saved.totalCorrect===1)toast('🎖 Primer acierto: ¡ya estás aprendiendo!')}else{saved.streak=0;session.roundStreak=0;session.attempts++;session.feedback={correct:false}}
 persist();render();}
function nextQuestion(){if(!session)return;session.index++;session.answer=null;session.feedback=null;session.attempts=0;session.hintsUsed=0;if(session.index>=session.queue.length)stopTimer();render();window.scrollTo({top:0,behavior:'smooth'})}
function revealAnswer(){if(!session)return;session.feedback={correct:true,reveal:true,gain:0};saved.streak=0;persist();render()}
function finishView(){const ended=session.timeEnded;const count=session.queue.length;const correct=session.completed;const score=Math.round(correct/count*100);return `<div class="paper quiz-shell final-hero"><div class="final-medal">${score>=80?'🏆':score>=50?'🥈':'🌱'}</div><p class="eyebrow">${ended?'El cronómetro llegó a cero':'¡Misión completada!'}</p><h1 class="subhead">${score>=80?'¡Excelente recorrido!':score>=50?'¡Vas por buen camino!':'Cada intento te hace avanzar'}</h1><div class="final-score">${session.points} XP</div><p class="lead" style="margin:9px auto 24px;text-align:center">Conseguiste ${correct} respuestas correctas de ${count} desafíos. ${ended?'Probá de nuevo para mejorar tu tiempo y precisión.':'Podés volver a practicar o pasar a otra estación.'}</p><div class="stat-grid" style="max-width:520px;margin:0 auto 24px"><div class="stat-tile"><div class="n">${score} %</div><div class="s">aciertos del recorrido</div></div><div class="stat-tile"><div class="n">${saved.bestStreak} ⚡</div><div class="s">récord global de racha</div></div></div><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><button class="button" data-action="repeat-session">↻ Volver a jugar</button><button class="button secondary" data-view="ruta">Elegir estación →</button><button class="button ghost" data-view="practico">Ver Práctico 4</button></div></div>`}
function labInfo(){const d=lab.dist,p=lab.p,n=lab.n,K=lab.K,N=lab.N,s=lab.nSample,lambda=lab.lambda;
 if(d==='bernoulli')return {xs:[0,1],pr:[1-p,p],mean:p,distName:'Bernoulli(p)',formula:'P(X=1)=p; P(X=0)=1−p',description:'Un ensayo con dos resultados. Mové p para ver cómo cambian las probabilidades.',k:Math.min(1,lab.k)};
 if(d==='binomial')return {xs:Array.from({length:n+1},(_,i)=>i),pr:Array.from({length:n+1},(_,i)=>binom(n,p,i)),mean:n*p,distName:'Binomial(n,p)',formula:'P(X=k)=C(n,k)·pᵏ·(1−p)ⁿ⁻ᵏ',description:'Contá éxitos en n ensayos independientes de probabilidad p constante.',k:Math.min(n,lab.k)};
 if(d==='hipergeometrica'){let from=Math.max(0,s-(N-K)),to=Math.min(K,s);return {xs:Array.from({length:to-from+1},(_,i)=>from+i),pr:Array.from({length:to-from+1},(_,i)=>hyper(N,K,s,from+i)),mean:s*K/N,distName:'Hipergeométrica(N,K,n)',formula:'P(X=k)=C(K,k)·C(N−K,n−k)/C(N,n)',description:'Elegí n elementos de N sin reposición; K elementos son éxitos.',k:Math.min(to,Math.max(from,lab.k))}}
 let last=Math.max(14,Math.ceil(lambda+4*Math.sqrt(lambda)));return {xs:Array.from({length:last+1},(_,i)=>i),pr:Array.from({length:last+1},(_,i)=>pois(lambda,i)),mean:lambda,distName:'Poisson(λ)',formula:'P(X=k)=e⁻λ·λᵏ/k!',description:'Conteo de eventos en un intervalo con tasa promedio λ.',k:Math.min(last,lab.k)};

function labView(){const d=lab.dist,inf=labInfo();lab.k=inf.k;let mx=Math.max(.0001,...inf.pr,...(lab.empirical||[]).map(v=>v/lab.total||0));const panel=`<div class="paper"><h3>Panel de control</h3><p class="small-muted">Cambiá los parámetros y mirá cómo cambia la distribución.</p><div class="control-field"><label for="dist">Distribución</label><select id="dist" data-lab-dist><option value="bernoulli" ${d==='bernoulli'?'selected':''}>Bernoulli</option><option value="binomial" ${d==='binomial'?'selected':''}>Binomial</option><option value="hipergeometrica" ${d==='hipergeometrica'?'selected':''}>Hipergeométrica</option><option value="poisson" ${d==='poisson'?'selected':''}>Poisson</option></select></div>${d==='bernoulli'||d==='binomial'?slider('p','Probabilidad de éxito p',lab.p,.05,.95,.05,2):''}${d==='binomial'?slider('n','Número de ensayos n',lab.n,1,20,1):''}${d==='hipergeometrica'?slider('N','Población N',lab.N,10,40,1)+slider('K','Éxitos en población K',lab.K,1,Math.min(20,lab.N-1),1)+slider('nSample','Tamaño de muestra n',lab.nSample,1,Math.min(15,lab.N),1):''}${d==='poisson'?slider('lambda','Tasa esperada λ',lab.lambda,1,12,.5,1):''}${slider('k','Valor a estudiar k',lab.k,inf.xs[0],inf.xs[inf.xs.length-1],1)}<button class="button" style="width:100%" data-action="simulate">▶ Simular 200 experimentos</button><button class="button ghost small" style="margin-top:9px;width:100%" data-action="clear-simulation">Limpiar simulación</button></div>`;

function slider(name,label,val,min,max,step,dec=0){return `<div class="control-field"><label for="lab-${name}">${label}<output id="out-${name}">${fmt(val,dec)}</output></label><input id="lab-${name}" data-lab-param="${name}" type="range" min="${min}" max="${max}" step="${step}" value="${val}" aria-label="${label}"></div>`}
function changeDist(dist){lab.dist=dist;lab.k=dist==='bernoulli'?1:dist==='poisson'?3:dist==='hipergeometrica'?2:3;lab.empirical=null;lab.total=0;render()}
function changeParam(param,value){lab[param]=param==='p'||param==='lambda'?Number(value):Math.round(Number(value));if(lab.dist==='hipergeometrica'){lab.K=Math.min(lab.K,lab.N-1);lab.nSample=Math.min(lab.nSample,lab.N)}lab.empirical=null;lab.total=0;render()}
function simulate(){const inf=labInfo();if(!lab.empirical)lab.empirical=[];for(let i=0;i<200;i++){let outcome=0;if(lab.dist==='bernoulli')outcome=Math.random()<lab.p?1:0;else if(lab.dist==='binomial'){for(let j=0;j<lab.n;j++)if(Math.random()<lab.p)outcome++}else if(lab.dist==='hipergeometrica'){let success=lab.K,remaining=lab.N;for(let j=0;j<lab.nSample;j++){if(Math.random()<success/remaining){outcome++;success--}remaining--}}else{let v=Math.exp(-lab.lambda),r=1;do{outcome++;r*=Math.random()}while(r>v);outcome--}lab.empirical[outcome]=(lab.empirical[outcome]||0)+1}lab.total+=200;render()}

function formulaData(recipe, v){const m=MATH, n=x=>mCalcNumber(x), vv=x=>m.v(x), o=x=>m.o(x), pw=(b,e)=>m.sup(b,e), cmb=(a,b)=>m.comb(a,b), pp=m.v('p'), kk=m.v('k'), ii=m.v('i'); const P=s=>`${m.v('P')}${o('(')}${vv('X')}${s}${o(')')}`;const k=n(v.k), N=n(v.N), K=n(v.K), sn=n(v.n), p=n(v.p), one=n(1), lambda=n(v.lambda), up=n(v.upper);let symbolic='',substituted='',expression='',note='';

 let value=expression();if(pos<tokens.length)throw Error('Hay símbolos adicionales en la expresión.');if(!Number.isFinite(value))throw Error('El resultado está fuera del rango calculable.');return value;
}
function calculatorMarkup(q){const [initial]=guideOf(q);let recipe=toolbox.recipe||initial,fd=formulaData(recipe,toolbox.vars);let options=RECIPE_CHOICES.map(([id,label])=>`<option value="${id}" ${recipe===id?'selected':''}>${label}</option>`).join('');const keypad=[['AC','(' ,')','⌫'],['7','8','9','÷'],['4','5','6','×'],['1','2','3','−'],['0',',','+','^'],['C(','!','exp(','=']];return `<aside class="quiz-tools" aria-label="Herramientas para resolver"><div class="tool-header"><span><span class="tool-icon">∑</span><span><b>Estación de cálculo</b><small>Tu espacio de trabajo</small></span></span><button type="button" class="tool-close" data-tool-action="toggle" aria-label="Cerrar herramientas">✕</button></div><div class="tool-tabs" role="tablist" aria-label="Herramientas"><button class="tool-tab ${toolbox.tab==='calc'?'active':''}" data-tool-tab="calc" aria-selected="${toolbox.tab==='calc'}">🧮 Calculadora</button><button class="tool-tab ${toolbox.tab==='formulas'?'active':''}" data-tool-tab="formulas" aria-selected="${toolbox.tab==='formulas'}">∑ Fórmulas</button><button class="tool-tab ${toolbox.tab==='notes'?'active':''}" data-tool-tab="notes" aria-selected="${toolbox.tab==='notes'}">✎ Borrador</button></div>${toolbox.tab==='calc'?`<div class="tool-body"><div class="calc-tip">Operá paso a paso. Escribí expresiones o usá las teclas.</div><label class="calc-label" for="calc-expression">Expresión matemática</label><input id="calc-expression" class="calc-expression" type="text" spellcheck="false" autocomplete="off" value="${htmlEscape(toolbox.expr)}" placeholder="C(6;2)×0,4^2×0,6^4" aria-label="Expresión de cálculo"><div class="calc-display" aria-live="polite"><small>${toolbox.notice?'Aviso':'Resultado del cálculo'}</small><strong class="${toolbox.notice?'calc-error':''}">${htmlEscape(toolbox.notice|| (toolbox.ans===null?'—':formatAnswerNumber(toolbox.ans)))}</strong></div><div class="calc-keys">${keypad.flatMap(row=>row.map(label=>`<button type="button" class="calc-key ${label==='='?'equal':label==='AC'?'clear':''}" data-calc-key="${htmlEscape(label)}" aria-label="${label==='⌫'?'Borrar último':label==='AC'?'Borrar todo':label}">${label}</button>`)).join('')}</div><div class="calc-quick"><button data-calc-key=";" type="button">; parámetro</button><button data-calc-key="√(" type="button">√x</button><button data-calc-key="ln(" type="button">ln</button><button data-calc-key="Ans" type="button">Ans</button><button data-calc-key="Bcdf(" type="button">F binomial</button><button data-calc-key="Pcdf(" type="button">F Poisson</button></div><div class="calc-legend"><strong>Funciones útiles</strong><span><code>C(n;k)</code> combinatoria</span><span><code>B(n;p;k)</code> binomial exacta</span><span><code>H(N;K;n;k)</code> hipergeométrica</span><span><code>Pois(λ;k)</code> Poisson exacta</span><span><code>Bcdf(n;p;k)</code> y <code>Pcdf(λ;k)</code> acumuladas</span><span>Usá <b>;</b> entre parámetros y <b>,</b> para decimales.</span></div>${toolbox.ans!==null&&!toolbox.notice?`<button type="button" class="button tool-insert" data-tool-action="insert-answer">↗ Pasar resultado a mi respuesta</button>`:''}${toolbox.history.length?`<details class="calc-history"><summary>Historial (${toolbox.history.length})</summary>${toolbox.history.slice(0,5).map((h,i)=>`<button type="button" data-calc-history="${i}"><span>${htmlEscape(h.expr)}</span><b>${formatAnswerNumber(h.value)}</b></button>`).join('')}</details>`:''}</div>`:toolbox.tab==='formulas'?`<div class="tool-body"><p class="calc-tip">Las fórmulas se adaptan al ejercicio. Cambiá parámetros y revisá la sustitución antes de calcular.</p><label class="calc-label" for="formula-recipe">Método a utilizar</label><select id="formula-recipe" data-formula-recipe>${options}</select><div class="math-section"><span class="overline">01 / Fórmula general</span><div class="math-display">${fd.symbolic}</div></div><div class="form-fields">${RECIPE_FIELDS[recipe].map(key=>`<label>${htmlEscape(PARAM_LABEL[key]||key)}<input class="formula-number" inputmode="decimal" data-formula-var="${key}" type="text" value="${htmlEscape(String(toolbox.vars[key]).replace('.',','))}" aria-label="${htmlEscape(PARAM_LABEL[key]||key)}"></label>`).join('')}</div><div class="math-section emphasized"><span class="overline">02 / Sustitución de los datos</span><div class="math-display">${fd.substituted}</div></div><p class="math-note">💡 ${htmlEscape(fd.note)}</p><div class="formula-expression"><span>Expresión preparada</span><code>${htmlEscape(fd.expression)}</code></div><button class="button" style="width:100%" type="button" data-tool-action="send-formula">🧮 Llevar expresión a calculadora →</button><p class="small-muted" style="margin-top:11px">El resultado no se revela aquí: podés comprobarlo al calcular y luego decidir qué escribir.</p></div>`:`<div class="tool-body"><label class="calc-label" for="tool-notes">Escribí tu procedimiento</label><textarea id="tool-notes" class="tool-notes" rows="9" placeholder="1. Identifico la distribución...&#10;2. Defino n, p, k...&#10;3. Planteo la expresión...">${htmlEscape(toolbox.notes[q.id]||'')}</textarea><p class="small-muted">Tu borrador se mantiene al cambiar de pregunta durante esta sesión. No influye en el puntaje.</p><button class="button secondary small" data-tool-action="clear-notes">Borrar borrador</button></div>`}</aside>`}
function enhanceQuiz(){if(!session||view!=='quiz'||session.index>=session.queue.length)return;let q=session.queue[session.index];if(q.type!=='number')return;initToolsForQuestion(q);let card=$('.quiz-card'),input=$('#quiz-input');if(!card||!input)return;
 input.insertAdjacentHTML('beforebegin',`<div class="tool-intro"><div><span class="overline">Resolución numérica</span><div class="tool-intro-text">Vos escribís el resultado. La calculadora es una ayuda opcional.</div></div><button type="button" class="button ${toolbox.open?'secondary':'amber'} small" data-tool-action="toggle">${toolbox.open?'✕ Cerrar herramientas':'🧮 Abrir calculadora y fórmulas'}</button></div>`);
 if(toolbox.open){let wrap=document.createElement('div');wrap.className='quiz-workspace';card.parentNode.insertBefore(wrap,card);wrap.append(card);wrap.insertAdjacentHTML('beforeend',calculatorMarkup(q));$('.quiz-shell').classList.add('quiz-expanded')}
}
function safeStartWorkshop(key){toolbox.questionId=null;startSession('workshop',key)}
function onWorkshopButton(e){let btn=e.target.closest('[data-start-workshop],[data-start-workshop-one],[data-work-filter],[data-tool-action],[data-tool-tab],[data-formula-recipe],[data-calc-key],[data-calc-history]');if(!btn)return;
 if(btn.matches('[data-start-workshop]')){e.preventDefault();e.stopPropagation();safeStartWorkshop(btn.dataset.startWorkshop);return}
 if(btn.matches('[data-start-workshop-one]')){e.preventDefault();e.stopPropagation();safeStartWorkshop('single:'+btn.dataset.startWorkshopOne);return}
 if(btn.matches('[data-work-filter]')){e.preventDefault();e.stopPropagation();workshopFilter=btn.dataset.workFilter;render();return}
 if(btn.matches('[data-tool-tab]')){e.preventDefault();e.stopPropagation();toolbox.tab=btn.dataset.toolTab;render();return}
 if(btn.matches('[data-calc-history]')){e.preventDefault();e.stopPropagation();let h=toolbox.history[+btn.dataset.calcHistory];if(h){toolbox.expr=h.expr;toolbox.ans=h.value;toolbox.notice='';render()}return}
 if(btn.matches('[data-calc-key]')){e.preventDefault();e.stopPropagation();let key=btn.dataset.calcKey;if(key==='AC'){toolbox.expr='';toolbox.ans=null;toolbox.notice=''}else if(key==='⌫'){toolbox.expr=toolbox.expr.slice(0,-1);toolbox.notice=''}else if(key==='='){computeToolExpr()}else{toolbox.expr+=key;toolbox.notice=''}render();return}
 if(btn.matches('[data-tool-action]')){e.preventDefault();e.stopPropagation();switch(btn.dataset.toolAction){case 'toggle':toolbox.open=!toolbox.open;render();break;case 'send-formula':{try{const fd=formulaData(toolbox.recipe,toolbox.vars);toolbox.expr=fd.expression;toolbox.notice='';toolbox.ans=null;toolbox.tab='calc';render()}catch(err){toast('Revisá los parámetros de la fórmula.')}break}case 'insert-answer':{if(Number.isFinite(toolbox.ans)&&session){session.answer=Number(toolbox.ans.toPrecision(12)).toString().replace('.',',');session.feedback=null;render();toast('Resultado copiado a la respuesta. Comprobalo cuando quieras.')}break}case 'clear-notes':toolbox.notes[session.queue[session.index].id]='';render();break}return}
}
function computeToolExpr(){try{let val=calcParse(toolbox.expr);toolbox.ans=val;toolbox.notice='';toolbox.history.unshift({expr:toolbox.expr,value:val});toolbox.history=toolbox.history.slice(0,10)}catch(err){toolbox.notice=err.message}}
document.addEventListener('click',onWorkshopButton,true);
document.addEventListener('change',e=>{if(e.target.matches('[data-formula-recipe]')){toolbox.recipe=e.target.value;toolbox.formulaCalculated=null;render();return}if(e.target.matches('[data-formula-var]')){let key=e.target.dataset.formulaVar;let value=Number(e.target.value.replace(',','.'));if(!Number.isFinite(value)){toast('Escribí un parámetro numérico válido.');return}let integer=['n','N','K','k','upper'].includes(key);if((integer&&!Number.isInteger(value))||(['n','N','K'].includes(key)&&value<0)||(['p','p0'].includes(key)&&(value<0||value>1))){toast('Revisá: este parámetro debe ser válido para la distribución.');return}toolbox.vars[key]=value;render()}},true);
document.addEventListener('input',e=>{if(e.target.id==='calc-expression'){toolbox.expr=e.target.value;toolbox.notice=''}if(e.target.id==='tool-notes'&&session)toolbox.notes[session.queue[session.index].id]=e.target.value},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='calc-expression'){e.preventDefault();e.stopImmediatePropagation();computeToolExpr();render()}},true);
// Ampliaciones visuales no intrusivas en el cierre y las estadísticas originales.
function extendProgressUI(){
 if(view==='progreso'){
   const count=WORKSHOP_QUESTIONS.filter(q=>saved.solved[q.id]).length;
   $('#content .view')?.insertAdjacentHTML('beforeend',`<section class="workshop-end" style="margin-top:25px"><div><b>✎ Taller de resolución · ${count}/${WORKSHOP_QUESTIONS.length} desafíos</b><span>Ejercicios extra de respuesta escrita, con calculadora y fórmulas aplicadas.</span></div><button class="button" data-view="taller">Ir al taller →</button></section>`);
 }
 if(view==='quiz'&&session?.mode==='workshop'&&session.index>=session.queue.length){
   const end=$('.final-hero > div:last-child');
   end?.insertAdjacentHTML('beforeend','<button class="button amber" data-view="taller">← Volver al taller</button>');
 }
}
// Acoplamos el panel al render existente sin reescribir los desafíos de origen.
const originalBindView=bindView;
bindView=function(){originalBindView();enhanceQuiz();extendProgressUI()};

function bindView(){ /* Eventos delegados globalmente, sin duplicar escuchas al cambiar de pantalla. */ }
function handleAction(btn){const a=btn.dataset.action;if(a==='start-topic')return startSession('topic',btn.dataset.topic);if(a==='start-exercise')return startSession('exercise',btn.dataset.ex);if(a==='start-practical')return startSession('practical');if(a==='start-quick')return startSession('quick');if(a==='set-topic'){topic=btn.dataset.topic;flash=0;flashShown=false;return render()}if(a==='flip-card'){flashShown=!flashShown;return render()}if(a==='next-card'){flash++;flashShown=false;return render()}if(a==='pick-option'){if(!session||session.feedback?.correct)return;let i=Number(btn.dataset.index),q=session.queue[session.index];if(q.type==='multi'){let arr=Array.isArray(session.answer)?session.answer.slice():[];if(arr.includes(i))arr=arr.filter(x=>x!==i);else arr.push(i);session.answer=arr}else session.answer=i;session.feedback=null;return render()}if(a==='pick-region'){if(!session||session.feedback?.correct)return;let i=Number(btn.dataset.index),arr=Array.isArray(session.answer)?session.answer.slice():[];if(arr.includes(i))arr=arr.filter(x=>x!==i);else arr.push(i);session.answer=arr;session.feedback=null;return render()}if(a==='check-answer')return checkAnswer();if(a==='get-hint'){if(!session)return;let q=session.queue[session.index];if(session.hintsUsed<q.hints.length){session.hintsUsed++;session.feedback=null;render()}return}if(a==='reveal-answer')return revealAnswer();if(a==='next-question')return nextQuestion();if(a==='leave-quiz'){return nav(session?.mode==='workshop'?'taller':'ruta')}if(a==='repeat-session'){return startSession(session.mode,session.key)}if(a==='simulate')return simulate();if(a==='clear-simulation'){lab.empirical=null;lab.total=0;return render()}if(a==='reset-progress'){if(confirm('¿Querés borrar los puntos, récords y retos completados en este navegador?')){saved={xp:0,solved:{},streak:0,bestStreak:0,totalCorrect:0,totalAttempts:0,sessions:0};persist();toast('El progreso local se reinició.');render()}return}}
document.addEventListener('click',e=>{const btn=e.target.closest('button[data-action],button[data-view]');if(!btn)return;if(btn.dataset.view)nav(btn.dataset.view);else if(btn.dataset.action)handleAction(btn)});
document.addEventListener('input',e=>{if(e.target.id==='quiz-input'&&session){session.answer=e.target.value;session.feedback=null}if(e.target.matches('[data-lab-param]')){let out=$('#out-'+e.target.dataset.labParam);if(out)out.textContent=fmt(Number(e.target.value),e.target.dataset.labParam==='p'?2:e.target.dataset.labParam==='lambda'?1:0)}});
document.addEventListener('change',e=>{if(e.target.matches('[data-lab-dist]'))changeDist(e.target.value);if(e.target.matches('[data-lab-param]'))changeParam(e.target.dataset.labParam,e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='quiz-input'){e.preventDefault();checkAnswer()}});
$('#logo-link').addEventListener('click',e=>{e.preventDefault();nav('inicio')});
render();
</script>
